<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />

    <!-- Office JavaScript API -->
    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
</head>

<body>
    <!-- This file is used for ribbon button commands -->
    <script>
        console.log('Commands.html loaded successfully');
        
        // Test if Office.js is available
        if (typeof Office !== 'undefined') {
            console.log('Office.js is available');
            
            Office.onReady(() => {
                console.log('Office.js is ready');
                
                // Try to write directly to Excel when commands.html loads
                if (typeof Excel !== 'undefined') {
                    Excel.run(async (context) => {
                        try {
                            const worksheet = context.workbook.worksheets.getActiveWorksheet();
                            const range = worksheet.getRange("Z8");
                            range.values = [["COMMANDS.HTML LOADED!"]];
                            await context.sync();
                            console.log('Successfully wrote to Z8 from commands.html');
                        } catch (error) {
                            console.error('Error writing to Z8:', error);
                        }
                    });
                } else {
                    console.log('Excel API not available');
                }
            });
        } else {
            console.log('Office.js is not available');
        }
    </script>
</body>

</html>
