<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kanosym - Error</title>
    
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Roboto", "Helvetica Neue", sans-serif;
            background-color: #faf9f8;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .error-container {
            background: white;
            border-radius: 8px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            max-width: 400px;
            text-align: center;
        }
        .error-icon {
            font-size: 48px;
            color: #d13438;
            margin-bottom: 16px;
        }
        .error-title {
            font-size: 20px;
            font-weight: 600;
            color: #323130;
            margin-bottom: 12px;
        }
        .error-message {
            color: #605e5c;
            line-height: 1.4;
            margin-bottom: 24px;
        }
        .error-button {
            background: #0078d4;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
        }
        .error-button:hover {
            background: #106ebe;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-icon">⚠️</div>
        <div class="error-title">Error</div>
        <div class="error-message" id="error-message">
            An unexpected error occurred.
        </div>
        <button class="error-button" onclick="closeDialog()">OK</button>
    </div>

    <script>
        // Get error message from URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const message = urlParams.get('message');
        if (message) {
            document.getElementById('error-message').textContent = decodeURIComponent(message);
        }

        function closeDialog() {
            if (window.Office) {
                Office.context.ui.messageParent('close');
            } else {
                window.close();
            }
        }
    </script>
</body>
</html>
